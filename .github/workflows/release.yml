# Release workflow
#
# Releases (release-please, configured in release-please-config.json): on every
# push to `main`, the `release-please` job opens or updates a release PR that
# bumps Cargo.toml / Cargo.lock and adds a CHANGELOG.md entry built from the
# commits since the last release. Merging that PR makes the job create the
# `v<version>` tag and a GitHub Release whose body is that entry, and only then
# do `build` and `upload` run.
#
# The crate isn't published to crates.io; the GitHub Release is the release. It
# carries one native library per target under the name .NET's
# [DllImport("cas_core_lib")] resolves (cas_core_lib.dll, libcas_core_lib.so,
# libcas_core_lib.dylib), the csbindgen NativeMethods.g.cs, and SHA256SUMS.
#
# Hardening:
# - The workflow grants nothing by default; each job asks for what it needs.
#   `build` runs the tag's code with a read-only token; only `upload` can write
#   to the release, and it runs no repository code.
# - `upload` runs in the `release` environment (required reviewers approve it).
# - Actions are pinned to commit SHAs, checkouts don't persist credentials, the
#   Rust toolchain comes from rust-toolchain.toml and every cargo call is --locked.

name: Release

on:
  push:
    branches: [ "main" ]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: Release PR, tag and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the v<version> tag and create the GitHub Release
      pull-requests: write  # open and update the release PR
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Open the release PR, or tag and release a merged one
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PR opened with the default GITHUB_TOKEN doesn't trigger the PR
          # workflows. Set the RELEASE_PLEASE_TOKEN secret (GitHub App or
          # fine-grained PAT with Contents and Pull requests read/write) so CI
          # runs on release PRs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build and test ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.host }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `library` is the file cargo writes to target/release for the cdylib.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            library: libcas_core_lib.so
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            library: cas_core_lib.dll
          - host: macos-latest # arm64
            target: aarch64-apple-darwin
            library: libcas_core_lib.dylib
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Check the runner's target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"

      - name: Check that the tag matches Cargo.toml
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "cas_core_lib") | .version')
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::release tag ${TAG} doesn't match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Test
        run: cargo test --release --locked --verbose

      - name: Build
        run: cargo build --release --locked --verbose

      # build.rs writes the C# bindings to ../cas-dotnet-sdk/generated (relative
      # to the crate), i.e. next to the checkout. Stage everything inside the
      # workspace, since upload-artifact doesn't take paths outside it.
      - name: Stage the release files
        env:
          LIBRARY: ${{ matrix.library }}
        run: |
          mkdir dist
          cp "target/release/${LIBRARY}" dist/
          cp ../cas-dotnet-sdk/generated/NativeMethods.g.cs dist/
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  upload:
    name: Attach the libraries to the GitHub Release
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # upload release assets; no other job can write to the release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: native-*

      # Every target generates NativeMethods.g.cs from the same source, so the
      # copies must agree (Windows may check the sources out with CRLF).
      # Attach one copy, the Linux one.
      - name: Assemble the release files
        run: |
          set -euo pipefail
          for f in artifacts/native-*/NativeMethods.g.cs; do
            diff --strip-trailing-cr artifacts/native-x86_64-unknown-linux-gnu/NativeMethods.g.cs "$f"
          done
          mkdir release
          # One per build target; keep in step with the matrix.
          cp artifacts/native-x86_64-unknown-linux-gnu/libcas_core_lib.so release/
          cp artifacts/native-x86_64-pc-windows-msvc/cas_core_lib.dll release/
          cp artifacts/native-aarch64-apple-darwin/libcas_core_lib.dylib release/
          cp artifacts/native-x86_64-unknown-linux-gnu/NativeMethods.g.cs release/
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # No --clobber: assets of a published release are never replaced. If a
      # run fails halfway, delete the partial assets by hand and rerun the job.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" release/*
