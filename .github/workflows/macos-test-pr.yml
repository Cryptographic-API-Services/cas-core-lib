name: macOS PR Tests

# Runs on every PR, whatever the base branch, so PRs into epic/** integration
# branches get CI too (#109).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install toolchain from rust-toolchain.toml
      run: rustup toolchain install
    # --locked fails the build if Cargo.toml and the committed Cargo.lock
    # disagree (#110). --release tests the profile consumers ship.
    - name: Build
      run: cargo build --release --locked --verbose
    - name: Run tests
      run: cargo test --release --locked --verbose
